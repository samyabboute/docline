<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable — Docline</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFFFFF;--bg2:#F7F6FF;--bg3:#EEECFB;
  --ink:#0D0520;--ink2:#2D1B69;--ink3:#6B7280;
  --p:#4C1D95;--p2:#6D28D9;--p3:#8B5CF6;--p4:#DDD6FE;
  --orange:#EA580C;--orange2:#F97316;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --pill:999px;--r:8px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --ease:cubic-bezier(.25,.46,.45,.94);
}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;text-align:center;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;top:-150px;left:50%;transform:translateX(-50%);
  width:700px;height:500px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(139,92,246,.1) 0%,rgba(109,40,217,.04) 45%,transparent 70%);
  pointer-events:none;z-index:0;
}

.wrap{position:relative;z-index:1;max-width:480px;width:100%;animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:1px;font-size:19px;font-weight:900;letter-spacing:-1px;line-height:1;text-decoration:none;margin-bottom:52px}
.logo span:first-child{color:var(--ink)}
.logo span:nth-child(2){color:var(--p2)}
.logo-dot{width:5px;height:5px;border-radius:50%;background:var(--orange2);display:inline-block;vertical-align:bottom;margin-left:1.5px;margin-bottom:2.5px}

/* Big 404 */
.num{
  font-size:clamp(96px,20vw,160px);font-weight:900;letter-spacing:-8px;line-height:1;
  background:linear-gradient(135deg,var(--p2) 0%,var(--p3) 50%,var(--orange2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;display:block;
}

/* Badge */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--p4);
  color:var(--orange);font-size:11px;font-weight:700;
  padding:4px 14px;border-radius:var(--pill);margin-bottom:20px;
  letter-spacing:.08em;text-transform:uppercase;
}

h1{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin-bottom:12px}
p{font-size:15px;color:var(--ink3);line-height:1.7;margin-bottom:36px;max-width:360px;margin-left:auto;margin-right:auto}

/* Button */
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14.5px;font-weight:700;color:#fff;
  background:var(--ink);padding:13px 28px;border-radius:var(--pill);
  border:none;cursor:pointer;font-family:var(--font);transition:all .18s;
  box-shadow:0 2px 10px rgba(13,5,32,.3);text-decoration:none;
}
.btn-primary:hover{background:var(--p);transform:translateY(-2px);box-shadow:0 8px 28px rgba(76,29,149,.38)}
.btn-primary svg{transition:transform .2s}
.btn-primary:hover svg{transform:translateX(3px)}

/* Separator dots */
.dots{display:flex;gap:8px;justify-content:center;margin-top:48px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--p4)}
.dot:nth-child(2){background:var(--orange2);opacity:.7}
.dot:nth-child(3){background:var(--p4)}

/* Redirecting state */
.redirect-notice{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;
  padding:8px 20px;border-radius:var(--pill);
  font-size:12px;font-weight:600;font-family:var(--font);
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(13,5,32,.3);
  animation:slideUp .4s var(--ease) both;
}
.redirect-notice.hidden{display:none}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.rn-dot{width:6px;height:6px;border-radius:50%;background:var(--orange2);animation:blink .8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<div class="wrap">
  <a href="/landing" class="logo">
    <span>doc</span><span>line</span><span class="logo-dot"></span>
  </a>

  <span class="num">404</span>

  <div class="badge">Page introuvable</div>

  <h1>Cette page n'existe pas</h1>
  <p>Le lien que vous avez suivi est peut-être cassé, ou la page a été déplacée. Retournez à l'accueil pour continuer.</p>

  <a class="btn-primary" href="/landing">
    Retour à l'accueil
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>

  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<div class="redirect-notice hidden" id="rn">
  <span class="rn-dot"></span>
  Redirection en cours…
</div>

<script>
// GitHub Pages 404 router — maps clean URLs → .html files under /docline/
(function() {
  var base = '/docline';
  var fullPath = window.location.pathname; // e.g. /docline/login
  var path = fullPath.replace(base, '') || '/'; // e.g. /login
  var search = window.location.search;
  var hash   = window.location.hash;

  var routeMap = {
    '/':              base + '/find-doctor.html',
    '/find-doctor':   base + '/find-doctor.html',
    '/login':         base + '/login.html',
    '/dashboard':     base + '/app.html',
    '/app':           base + '/app.html',
    '/admin':         base + '/admin-users.html',
    '/admin-users':   base + '/admin-users.html',
    '/admin-featured':base + '/admin-featured.html',
    '/admin-emails':  base + '/admin-emails.html',
    '/admin-revenue': base + '/admin-revenue.html',
    '/admin-security':base + '/admin-security.html',
    '/admin-settings':base + '/admin-settings.html',
    '/patients':      base + '/patients.html',
    '/clients':       base + '/clients.html',
    '/calendar':      base + '/calendar.html',
    '/invoices':      base + '/invoices.html',
    '/proposals':     base + '/proposals.html',
    '/pricing':       base + '/pricing.html',
    '/privacy':       base + '/privacy.html',
    '/terms':         base + '/terms.html',
    '/timer':         base + '/timer.html',
    '/book':          base + '/book.html',
    '/mes-rdv':       base + '/mes-rdv.html',
    '/consultations': base + '/consultations.html',
    '/ordonnances':   base + '/ordonnances.html',
    '/queue':         base + '/queue.html',
    '/labo':          base + '/labo.html',
    '/staff':         base + '/staff.html',
    '/onboarding':    base + '/onboarding.html',
    '/profil-public': base + '/profil-public.html',
    '/confirm':       base + '/confirm.html',
    '/disponibilites':base + '/disponibilites.html',
    '/results-view':  base + '/results-view.html',
    '/landing':       base + '/landing.html',
  };

  var dest = routeMap[path];

  // Fallback : essayer path + '.html'
  if (!dest) {
    // If no route found, show the 404 page as-is
    return;
  }

  // Show redirect notice before navigating
  var rn = document.getElementById('rn');
  if (rn) rn.classList.remove('hidden');

  window.location.replace(dest + search + hash);
})();
</script>
</body>
</html>
