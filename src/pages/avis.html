<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expérience patients — Docline</title>
<script src="config.js?v=4"></script>
<script src="shell.js?v=19"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6D28D9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<script src="loader.js?v=2"></script>
<script src="doctor-facts.js?v=1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0D0520;--ink2:#2D1B69;--ink3:#6B6385;--ink4:#9C96B3;--line:rgba(13,5,32,.07);--soft:#F3F0FF;--p:#4C1D95;--p2:#6D28D9;--p3:#8B5CF6}
.page-wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px}
.ex-header{margin-bottom:24px}
.ex-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--p2);margin-bottom:6px}
.ex-title{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.6px}
.ex-sub{font-size:13.5px;color:var(--ink3);margin-top:6px;max-width:66ch;line-height:1.55}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.sec-h span{font-size:12.5px;color:var(--ink4)}
.private{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#93500B;background:#FFF4E0;border-radius:999px;padding:3px 9px}
.public{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#067647;background:#ECFDF3;border-radius:999px;padding:3px 9px}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bd.on{background:linear-gradient(160deg,#FBFAFF,#F3EEFF);border-color:rgba(109,40,217,.25)}
.bd-top{display:flex;align-items:center;gap:10px}
.bd-ic{width:38px;height:38px;border-radius:12px;background:#F2F0F7;display:flex;align-items:center;justify-content:center;flex:none}
.bd.on .bd-ic{background:var(--p)}
.bd-ic svg{width:18px;height:18px;fill:none;stroke:#9C96B3;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd.on .bd-ic svg{stroke:#fff}
.bd-t{font-size:14px;font-weight:800;color:var(--ink)}
.bd-s{font-size:11.5px;font-weight:700}
.bd.on .bd-s{color:#067647}
.bd:not(.on) .bd-s{color:var(--ink4)}
.bd-v{font-size:13px;color:var(--ink2);line-height:1.45}
.bd-v b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bd-bar{height:6px;border-radius:6px;background:#EEEBF5;overflow:hidden}
.bd-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p3));border-radius:6px}
.bd-n{font-size:11.5px;color:var(--ink4);line-height:1.45}

/* Attente */
.wait-grid{display:grid;grid-template-columns:260px 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi{display:flex;flex-direction:column;gap:14px}
.kpi-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4)}
.kpi-v{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-v small{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:0}
.trend{font-size:12px;font-weight:700;margin-top:4px}
.trend.good{color:#067647}.trend.bad{color:#B54708}.trend.flat{color:var(--ink4)}
.kpi-n{font-size:12px;color:var(--ink3);line-height:1.5}
.heat-wrap{overflow-x:auto}
.heat{display:grid;gap:3px;min-width:560px}
.heat-h{font-size:10.5px;color:var(--ink4);text-align:center;font-variant-numeric:tabular-nums}
.heat-d{font-size:11.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center}
.heat-c{height:26px;border-radius:6px;background:#F7F6FB;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink4);margin-top:10px;flex-wrap:wrap}
.heat-legend i{width:16px;height:10px;border-radius:3px;display:inline-block}
.finding{margin-top:14px;background:#FCFBFF;border:1px solid rgba(109,40,217,.12);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.55}
.finding b{color:var(--ink)}

/* Réponses */
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans .card{display:flex;flex-direction:column;gap:8px}
.ans-q{font-size:12.5px;color:var(--ink3);line-height:1.4;min-height:34px}
.ans-v{font-size:28px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.8px}
.ans-v small{font-size:12.5px;font-weight:600;color:var(--ink4);letter-spacing:0}

/* Messages */
.notes{display:flex;flex-direction:column;gap:10px}
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.note.unread{border-color:rgba(109,40,217,.3);background:#FCFBFF}
.note p{font-size:14px;color:var(--ink);line-height:1.6}
.note-m{font-size:11.5px;color:var(--ink4);margin-top:6px;display:flex;gap:8px;align-items:center}
.new{font-size:10px;font-weight:800;color:#fff;background:var(--p2);border-radius:999px;padding:2px 7px}

.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:1.6}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;text-align:left}
.how div{background:#FCFBFF;border:1px solid var(--line);border-radius:14px;padding:14px}
.how b{display:block;font-size:13px;color:var(--ink);margin-bottom:4px}
.how span{font-size:12.5px;color:var(--ink3);line-height:1.5}
.btn{display:inline-block;margin-top:16px;padding:10px 16px;border-radius:12px;font:600 13px Inter,sans-serif;background:var(--p);color:#fff;text-decoration:none}
@media(max-width:900px){.badges{grid-template-columns:1fr 1fr}.wait-grid{grid-template-columns:1fr}.ans{grid-template-columns:1fr}}
@media(max-width:600px){.page-wrap{padding:16px 14px 40px}.badges{grid-template-columns:1fr}.how{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="shell-sidebar" id="shell-sidebar"></aside>
  <div class="shell-overlay sb-overlay" id="shell-overlay"></div>
  <header class="shell-topbar" id="shell-topbar"></header>
  <main class="shell-main">
  <div class="shell-page" id="main-content"><div class="page-wrap">
    <div class="ex-header">
      <div class="ex-eyebrow">Votre cabinet</div>
      <h1 class="ex-title">Expérience patients</h1>
      <p class="ex-sub">Ce que vivent vos patients, mesuré par Docline à chaque passage. Vos badges s’affichent sur votre page publique. Vos messages et vos points à améliorer restent privés.</p>
    </div>
    <div id="content"><div class="empty">Chargement…</div></div>
  </div></div>
  </main>
</div>

<script>
var _supa = supabase.createClient(SUPA_URL, SUPA_KEY);
var DAYS_ORDER = [6, 7, 1, 2, 3, 4, 5];              // samedi → vendredi
var DAY_SHORT = { 1:'Lun', 2:'Mar', 3:'Mer', 4:'Jeu', 5:'Ven', 6:'Sam', 7:'Dim' };
var DAY_LONG = { 1:'lundi', 2:'mardi', 3:'mercredi', 4:'jeudi', 5:'vendredi', 6:'samedi', 7:'dimanche' };
var MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function day(iso){ var d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }

function badgeHtml(b){
  var ic = '<svg viewBox="0 0 24 24" aria-hidden="true">' + (DoctorFacts.ICONS[b.key] || '') + '</svg>';
  var timeBased = ['prend_le_temps','attente_courte','ponctuel'].indexOf(b.key) !== -1;
  var unit = timeBased ? 'passages mesurés' : 'patients';
  var body, bar = 0, next;
  if (b.earned) {
    body = '<div class="bd-v"><b>' + esc(DoctorFacts.badgeValue(b)) + '</b></div>';
    next = esc(b.detail) + ' · ' + b.n + ' ' + unit;
    bar = 100;
  } else if (!b.n || b.n < b.min_n) {
    var have = b.n || 0;
    body = '<div class="bd-v">Encore <b>' + (b.min_n - have) + '</b> ' + unit + ' pour le calculer</div>';
    bar = Math.round(have / b.min_n * 100);
    next = esc(b.detail) + (b.value != null && have ? ' · actuellement ' + esc(DoctorFacts.badgeValue(b)) : '');
  } else {
    var goal = b.key === 'prend_le_temps' ? 'au moins ' + b.threshold + ' min' : b.key === 'attente_courte' ? b.threshold + ' min au plus' : b.threshold + ' %';
    body = '<div class="bd-v">Actuellement <b>' + esc(DoctorFacts.badgeValue(b)) + '</b>, objectif ' + goal + '</div>';
    bar = b.key === 'attente_courte' ? Math.max(5, Math.min(99, Math.round(b.threshold / Math.max(b.value, 1) * 100)))
        : Math.max(5, Math.min(99, Math.round(b.value / b.threshold * 100)));
    next = esc(b.detail) + ' · ' + b.n + ' ' + unit;
  }
  return '<div class="bd' + (b.earned ? ' on' : '') + '"><div class="bd-top"><div class="bd-ic">' + ic + '</div><div><div class="bd-t">' + esc(b.label) + '</div>' +
    '<div class="bd-s">' + (b.earned ? 'Obtenu · affiché sur votre page' : 'Pas encore obtenu') + '</div></div></div>' + body +
    '<div class="bd-bar"><span style="width:' + bar + '%"></span></div><div class="bd-n">' + next + '</div></div>';
}

function heatColor(m){
  if (m <= 15) return ['#EDE7FF', '#4C1D95'];
  if (m <= 30) return ['#C9B8FB', '#2D1B69'];
  if (m <= 45) return ['#8B5CF6', '#fff'];
  if (m <= 60) return ['#F5A524', '#3D2300'];
  return ['#E5484D', '#fff'];
}

function heatHtml(cells){
  if (!cells.length) return '<div class="empty" style="padding:18px">La carte se remplit avec vos passages dans la file d’attente (3 passages par créneau au minimum).</div>';
  var hours = [], map = {};
  cells.forEach(function(c){ map[c.dow + '-' + c.hour] = c; });
  var hmin = Math.min.apply(null, cells.map(function(c){ return c.hour; })), hmax = Math.max.apply(null, cells.map(function(c){ return c.hour; }));
  hmin = Math.min(hmin, 8); hmax = Math.max(hmax, 17);
  for (var h = hmin; h <= hmax; h++) hours.push(h);
  var html = '<div class="heat" style="grid-template-columns:40px repeat(' + hours.length + ',1fr)"><div></div>' +
    hours.map(function(h){ return '<div class="heat-h">' + h + ' h</div>'; }).join('');
  DAYS_ORDER.forEach(function(d){
    html += '<div class="heat-d">' + DAY_SHORT[d] + '</div>';
    hours.forEach(function(h){
      var c = map[d + '-' + h];
      if (!c) { html += '<div class="heat-c" aria-hidden="true"></div>'; return; }
      var col = heatColor(c.median);
      html += '<div class="heat-c" style="background:' + col[0] + ';color:' + col[1] + '" title="' + DAY_LONG[d] + ' vers ' + h + ' h : ' + c.median + ' min (' + c.n + ' passages)">' + c.median + '</div>';
    });
  });
  return '<div class="heat-wrap">' + html + '</div></div>' +
    '<div class="heat-legend">Attente médiane en minutes, selon l’heure d’arrivée :' +
    [['#EDE7FF','≤ 15'],['#C9B8FB','≤ 30'],['#8B5CF6','≤ 45'],['#F5A524','≤ 60'],['#E5484D','> 60']].map(function(x){ return ' <i style="background:' + x[0] + '"></i>' + x[1]; }).join('') + '</div>';
}

function findingHtml(cells){
  var ok = cells.filter(function(c){ return c.n >= 3; });
  if (ok.length < 2) return '';
  var worst = ok.slice().sort(function(a, b){ return b.median - a.median; })[0];
  var best = ok.slice().sort(function(a, b){ return a.median - b.median; })[0];
  if (worst.median - best.median < 10) return '<div class="finding">Votre attente est régulière d’un créneau à l’autre : <b>' + best.median + ' à ' + worst.median + ' min</b>.</div>';
  var ratio = best.median > 0 ? Math.round(worst.median / best.median * 10) / 10 : null;
  return '<div class="finding">Le <b>' + DAY_LONG[worst.dow] + ' vers ' + worst.hour + ' h</b>, vos patients attendent <b>' + worst.median + ' min</b>, contre <b>' + best.median + ' min</b> le ' + DAY_LONG[best.dow] + ' vers ' + best.hour + ' h' +
    (ratio && ratio >= 1.5 ? ' (' + String(ratio).replace('.', ',') + ' fois plus)' : '') + '. Ouvrir la file plus tôt ou limiter les arrivées sur ce créneau réduirait l’attente.</div>';
}

function render(d){
  var a = d.answers || {}, w = d.wait || {}, notes = d.notes || [], badges = d.badges || [];
  var hasData = (a.n || 0) > 0 || (w.n90 || 0) > 0 || notes.length;
  var html = '';
  if (!hasData) {
    html += '<div class="empty"><b style="color:var(--ink);font-size:15px">Vos premières données arrivent avec vos consultations</b><br>Vous n’avez rien à demander : Docline mesure chaque passage et interroge chaque patient reçu, une seule fois.' +
      '<div class="how"><div><b>File d’attente</b><span>Chaque arrivée et chaque appel sont mesurés. Le patient répond sur son téléphone quand vous passez au suivant.</span></div>' +
      '<div><b>Rendez-vous en ligne</b><span>Quand vous marquez un rendez-vous comme terminé, le patient reçoit une invitation par email.</span></div>' +
      '<div><b>Votre page publique</b><span>Les badges obtenus et votre file en direct y apparaissent automatiquement.</span></div></div>' +
      '<a class="btn" href="/queue">Ouvrir ma file d’attente</a></div>';
  }
  var earned = badges.filter(function(b){ return b.earned; }).length;
  html += '<section class="sec"><div class="sec-h"><h2>Vos badges</h2><span class="public">' + earned + ' sur ' + badges.length + ' affiché' + (earned > 1 ? 's' : '') + ' sur votre page</span></div>' +
    '<div class="badges">' + badges.map(badgeHtml).join('') + '</div></section>';

  var trend = '';
  if (w.m30 != null && w.mprev != null) {
    var diff = w.m30 - w.mprev;
    trend = diff < -1 ? '<div class="trend good">' + Math.abs(diff) + ' min de moins que le mois précédent</div>'
          : diff > 1 ? '<div class="trend bad">' + diff + ' min de plus que le mois précédent</div>'
          : '<div class="trend flat">Stable par rapport au mois précédent</div>';
  }
  html += '<section class="sec"><div class="sec-h"><h2>Votre attente en salle</h2><span>Mesurée de l’arrivée à l’appel, sur 90 jours</span></div><div class="wait-grid">' +
    '<div class="card kpi"><div><div class="kpi-k">Ce mois-ci</div><div class="kpi-v">' + (w.m30 != null ? w.m30 + ' <small>min</small>' : '—') + '</div>' + trend +
      '<div class="kpi-n">' + (w.n30 || 0) + ' passages mesurés</div></div>' +
      '<div><div class="kpi-k">Durée d’une consultation</div><div class="kpi-v">' + (d.pace != null ? d.pace + ' <small>min</small>' : '—') + '</div>' +
      '<div class="kpi-n">' + (d.pace != null ? 'Sert à estimer l’attente affichée aux patients' : 'Calculée à partir de 10 consultations') + '</div></div></div>' +
    '<div class="card">' + heatHtml(d.heatmap || []) + findingHtml(d.heatmap || []) + '</div></div></section>';

  var q = [['listened','Se sont sentis écoutés'],['explained','Traitement bien expliqué'],['recommend','Vous recommanderaient à un proche']];
  html += '<section class="sec"><div class="sec-h"><h2>Ce que répondent vos patients</h2><span>' + (a.n || 0) + ' patients reçus' + (a.last30 ? ' · ' + a.last30 + ' ce mois-ci' : '') + '</span></div>' +
    '<div class="ans">' + q.map(function(x){
      return '<div class="card"><div class="ans-q">' + x[1] + '</div><div class="ans-v">' + (a[x[0]] != null ? a[x[0]] + ' <small>%</small>' : '—') + '</div>' +
        '<div class="bd-bar"><span style="width:' + (a[x[0]] || 0) + '%"></span></div></div>';
    }).join('') + '</div></section>';

  var unread = notes.filter(function(n){ return n.unread; }).length;
  html += '<section class="sec"><div class="sec-h"><h2>Messages de vos patients' + (unread ? ' <span class="new">' + unread + ' nouveau' + (unread > 1 ? 'x' : '') + '</span>' : '') + '</h2><span class="private">Lus par vous seul</span></div>' +
    (notes.length ? '<div class="notes">' + notes.map(function(n){
      return '<div class="note' + (n.unread ? ' unread' : '') + '"><p>« ' + esc(n.note) + ' »</p><div class="note-m">' + (n.unread ? '<span class="new">Nouveau</span>' : '') +
        esc(n.signed_by || 'Un patient') + ' · consultation du ' + day(n.visit_date) + '</div></div>';
    }).join('') + '</div>' : '<div class="empty">Les mots de vos patients apparaîtront ici. Ils ne sont jamais publiés.</div>') + '</section>';

  document.getElementById('content').innerHTML = html;
  if (unread) setTimeout(function(){ _supa.rpc('my_notes_mark_read'); }, 2500);
}

async function load(){
  var r = await _supa.rpc('my_experience');
  if (r.error) { document.getElementById('content').innerHTML = '<div class="empty">Impossible de charger vos données. Actualisez la page.</div>'; return; }
  render(r.data || {});
}

(async function(){
  var s = await _supa.auth.getSession();
  if (!s.data.session) { window.location.href = (typeof ghpNav === 'function' ? ghpNav('/login') : '/login'); return; }
  var u = s.data.session.user, meta = u.user_metadata || {};
  var subR = await _supa.from('subscriptions').select('plan,status,expires_at').eq('user_id', u.id).maybeSingle();
  var sub = subR && subR.data;
  var isPro = sub && sub.plan !== 'free' && sub.status === 'active' && (!sub.expires_at || new Date(sub.expires_at) > new Date());
  Shell.init({ page: 'avis', title: 'Expérience patients', isPro: isPro, plan: (sub && sub.plan) || 'free', userName: Shell.displayName(meta, u.email), userEmail: u.email });
  if (typeof Shell.guard === 'function' && !Shell.guard(sub)) return;
  if (typeof Shell.checkStaff === 'function') Shell.checkStaff(_supa, 'avis', 'Expérience patients');
  load();
})();
</script>
</body>
</html>
