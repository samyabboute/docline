<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau mot de passe · Docline</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F7F6FF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
/* Réinitialisation du mot de passe : un seul écran, mêmes règles que partout */
:root{ --bg:#F7F6FF; --ink:#140B2E; --text:#2A2340; --muted:#6E6A85; --line:#E7E3F5; --violet:#6D28D9; --violet-2:#8B5CF6; --ok:#059669; --err:#DC2626; --err-bg:#FEF2F2;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 18% 20%,rgba(167,139,250,.35),transparent 70%),radial-gradient(45% 40% at 70% 90%,rgba(196,181,253,.32),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:44px 16px}
.logo{display:flex;justify-content:center;margin-bottom:22px}.logo img{height:30px}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border:1px solid #fff;border-radius:26px;padding:30px 26px;box-shadow:0 30px 70px -32px rgba(46,16,101,.38)}
h1{font-size:25px;font-weight:800;letter-spacing:-.5px;color:var(--ink);text-align:center;margin-bottom:8px}
.lead{font-size:14.5px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:20px}
.fld{position:relative;margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:650;margin-bottom:5px}
.in{width:100%;padding:12px 44px 12px 14px;border-radius:13px;border:1px solid var(--line);background:#fff;font:500 15px var(--font);color:var(--ink)}
.in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(109,40,217,.12)}
.eye{position:absolute;right:7px;top:28px;width:32px;height:32px;border:none;background:none;border-radius:9px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.eye svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rules{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 18px;font-size:12px;color:var(--muted)}
.rules span{display:flex;align-items:center;gap:6px}
.rules span::before{content:"";width:8px;height:8px;border-radius:50%;background:#D8D4E8}
.rules span.ok{color:var(--ok)} .rules span.ok::before{background:var(--ok)}
.btn{width:100%;padding:14px;border:none;border-radius:99px;font:700 15px var(--font);color:#fff;cursor:pointer;background:linear-gradient(135deg,#5B21B6,var(--violet-2));display:block;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.eye:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.msg{display:none;font-size:13px;line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:12px;color:var(--err);background:var(--err-bg)}
.msg.on{display:block}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<main class="wrap">
  <div class="logo"><img src="/docline-logo.svg" alt="Docline"></div>
  <div class="card" id="card" aria-live="polite"><p class="lead">Ouverture du lien…</p></div>
</main>
<script>
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
var EYE = '<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
(async function init() {
  var s = (await sb.auth.getSession()).data.session;
  if (!s) { await new Promise(function (r) { setTimeout(r, 1200); }); s = (await sb.auth.getSession()).data.session; }
  if (location.hash) history.replaceState(null, '', location.pathname);
  if (!s) {
    $('card').innerHTML = '<h1>Lien expiré</h1><p class="lead">Ce lien de réinitialisation a déjà servi ou a expiré. Demandez-en un nouveau depuis la page de connexion.</p><a class="btn" href="/login">Page de connexion</a>';
    return;
  }
  $('card').innerHTML = '<h1>Nouveau mot de passe</h1><p class="lead">Pour <b>' + esc(s.user.email) + '</b>. Choisissez un mot de passe que vous n’utilisez nulle part ailleurs.</p>'
    + '<form id="f" novalidate>'
    + '<div class="fld"><label for="p1">Nouveau mot de passe</label><input class="in" id="p1" type="password" autocomplete="new-password"><button class="eye" type="button" data-for="p1" aria-label="Afficher">' + EYE + '</button></div>'
    + '<div class="fld"><label for="p2">Confirmation</label><input class="in" id="p2" type="password" autocomplete="new-password"><button class="eye" type="button" data-for="p2" aria-label="Afficher">' + EYE + '</button></div>'
    + '<div class="rules"><span id="r1">10 caractères ou plus</span><span id="r2">Majuscule et minuscule</span><span id="r4">Chiffre et caractère spécial</span><span id="r3">Identiques</span></div>'
    + '<button class="btn" id="go" type="submit" disabled>Enregistrer le mot de passe</button><div class="msg" id="m" role="alert"></div></form>';
  function check() {
    var a = $('p1').value, b = $('p2').value, r1 = a.length >= 10, r2 = /[a-z]/.test(a) && /[A-Z]/.test(a), r4 = /\d/.test(a) && /[^A-Za-z0-9]/.test(a), r3 = a.length > 0 && a === b;
    $('r1').classList.toggle('ok', r1); $('r2').classList.toggle('ok', r2); $('r4').classList.toggle('ok', r4); $('r3').classList.toggle('ok', r3);
    $('go').disabled = !(r1 && r2 && r4 && r3);
  }
  $('p1').oninput = check; $('p2').oninput = check;
  document.querySelectorAll('.eye').forEach(function (b) { b.onclick = function () { var x = $(b.getAttribute('data-for')); x.type = x.type === 'password' ? 'text' : 'password'; }; });
  $('p1').focus();
  $('f').onsubmit = async function (e) {
    e.preventDefault(); if ($('go').disabled) return;
    $('go').disabled = true; $('go').textContent = 'Enregistrement…';
    var r = await sb.auth.updateUser({ password: $('p1').value });
    if (r.error) {
      var m = r.error.message || '';
      $('m').textContent = /pwned|leaked|known/i.test(m) ? 'Ce mot de passe figure dans des fuites de données connues. Choisissez-en un autre.'
        : /same|different/i.test(m) ? 'Choisissez un mot de passe différent de l’ancien.'
        : /password/i.test(m) ? 'Mot de passe trop faible : 10 caractères minimum, avec une majuscule, une minuscule, un chiffre et un caractère spécial.'
        : 'Le mot de passe n’a pas pu être enregistré. Réessayez.';
      $('m').className = 'msg on'; $('go').textContent = 'Enregistrer le mot de passe'; check(); return;
    }
    var staff = false;
    try { var st = await sb.rpc('symphony_is_staff'); staff = st && st.data === true; } catch (e2) {}
    $('card').innerHTML = '<h1>Mot de passe enregistré</h1><p class="lead">Vous êtes connecté. Utilisez désormais ce mot de passe pour vous connecter.</p><a class="btn" href="' + (staff ? '/symphony-hq' : '/dashboard') + '">Continuer</a>';
  };
})();
</script>
</body>
</html>
