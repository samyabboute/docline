<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>KYC & Onboarding — Docline Symphony</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4C1D95">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=3"></script>
<style>
/* ── Reset & base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  /* New Light Premium palette */
  --bg:#FFFFFF;--bg2:#F7F6FF;--bg3:#EEECFB;
  --ink:#0D0520;--ink2:#2D1B69;--ink3:#6B7280;
  --p:#4C1D95;--p2:#6D28D9;--p3:#8B5CF6;--p4:#DDD6FE;
  --orange:#EA580C;--orange2:#F97316;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --font:'Inter',-apple-system,sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.1);
  --pill:999px;--r:8px;--rl:16px;
  /* Legacy aliases */
  --brand:#4C1D95;--brand-dark:#6D28D9;--brand-light:#EEECFB;--brand-glow:rgba(76,29,149,.12);
  --sidebar-bg:#0f172a;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:rgba(76,29,149,.18);--sidebar-border:rgba(255,255,255,.07);
  --bg-raised:#FFFFFF;--bg-subtle:#F7F6FF;--bg-hover:#EEECFB;
  --text-primary:#0D0520;--text-secondary:#2D1B69;--text-muted:#6B7280;--text-faint:#9CA3B8;
  --border-strong:rgba(0,0,0,.12);
  --success:#12B76A;--success-bg:#ECFDF5;--success-border:rgba(18,183,106,.2);
  --warning:#F79009;--warning-bg:#FFFAEB;--warning-border:rgba(247,144,9,.2);
  --danger:#F04438;--danger-bg:#FEF3F2;--danger-border:rgba(240,68,56,.2);
  --info:#2E90FA;--info-bg:#EFF8FF;--info-border:rgba(46,144,250,.2);
  --sidebar-w:240px;--topbar-h:56px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 8px rgba(0,0,0,.08);
  --shadow-brand:0 4px 14px rgba(76,29,149,.25);
  --t-fast:120ms cubic-bezier(.4,0,.2,1);--t-base:200ms cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;font-size:.8125rem;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-full)}

/* ── App shell ── */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;min-height:100vh}

/* ── Sidebar ── */
.sidebar{grid-row:1/-1;background:var(--sidebar-bg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--sidebar-border);z-index:200;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.sidebar-head{padding:16px 16px 14px;border-bottom:1px solid var(--sidebar-border);flex-shrink:0}
.sidebar-logo-icon svg{width:20px;height:20px;stroke:#a5a7f5;fill:none;stroke-width:2;stroke-linecap:round}
.sidebar-logo-text{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px}
.sidebar-section{padding:14px 16px 5px;font-size:.625rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.22)}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:1px 8px;border-radius:var(--r-md);color:rgba(255,255,255,.55);font-size:.8125rem;font-weight:500;cursor:pointer;transition:all .12s;border:none;background:transparent;text-decoration:none;width:calc(100% - 16px);text-align:left;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.8)}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--brand);border-radius:0 var(--r-full) var(--r-full) 0}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
.nav-item:hover svg,.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--sidebar-border);padding:10px 8px;flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer;transition:background .12s}
.sidebar-user:hover{background:var(--sidebar-hover)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand) 0%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:.6875rem;font-weight:600;color:rgba(255,255,255,.8)}
.user-role{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px}
#sb-user-menu{display:none;position:absolute;bottom:calc(100% + 4px);left:8px;right:8px;background:#1C1F28;border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);padding:6px;box-shadow:0 -12px 32px rgba(0,0,0,.5);z-index:300}

/* ── Topbar ── */
.topbar{background:var(--surface,#fff);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:100}
.topbar-title{font-size:.9375rem;font-weight:800;color:var(--text);letter-spacing:-.2px}
.topbar-badge{padding:2px 8px;border-radius:var(--r-full);font-size:.625rem;font-weight:700;background:rgba(217,119,6,.12);color:#D97706;letter-spacing:.04em}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.tb-btn{width:32px;height:32px;border-radius:var(--r-md);border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;transition:background .12s,color .12s}
.tb-btn:hover{background:var(--surface2);color:var(--text)}
.tb-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-dim);color:var(--brand);font-size:.6875rem;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── Main content ── */
.main{overflow-y:auto;grid-row:2;grid-column:2}
.page{padding:28px;max-width:1280px;margin:0 auto}

/* ── Page header ── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:1.375rem;font-weight:900;color:var(--text);letter-spacing:-.4px}
.page-sub{font-size:.8125rem;color:var(--text3);margin-top:4px}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface,#fff);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px 14px;position:relative;overflow:hidden;cursor:default}
.stat-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat-ico svg{width:18px;height:18px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat-num{font-size:26px;font-weight:900;line-height:1;margin-bottom:3px;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.03em}
.stat-card.amber .stat-ico{background:var(--warning-bg)}.stat-card.amber .stat-ico svg{stroke:var(--warning)}.stat-card.amber .stat-num{color:var(--warning)}
.stat-card.green .stat-ico{background:var(--success-bg)}.stat-card.green .stat-ico svg{stroke:var(--success)}.stat-card.green .stat-num{color:var(--success)}
.stat-card.violet .stat-ico{background:#EDE8FF}.stat-card.violet .stat-ico svg{stroke:var(--brand)}.stat-card.violet .stat-num{color:var(--brand)}
.stat-card.red .stat-ico{background:var(--danger-bg)}.stat-card.red .stat-ico svg{stroke:var(--danger)}.stat-card.red .stat-num{color:var(--danger)}
.stat-card.blue .stat-ico{background:var(--info-bg)}.stat-card.blue .stat-ico svg{stroke:var(--info)}.stat-card.blue .stat-num{color:var(--info)}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:240px;max-width:380px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search-input{width:100%;height:38px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px 0 36px;font-size:.8125rem;color:var(--text);background:var(--surface,#fff);outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(76,29,149,.07)}
.search-input::placeholder{color:var(--text4)}
.filter-select{height:38px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:.8125rem;color:var(--text2);background:var(--surface,#fff);outline:none;cursor:pointer;transition:border-color .15s}
.filter-select:focus{border-color:var(--brand)}
.chip{padding:5px 14px;border-radius:var(--r-full);font-size:.75rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface,#fff);color:var(--text3);transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ── Table card ── */
.table-card{background:var(--surface,#fff);border:1.5px solid var(--border);border-radius:18px;overflow:hidden}
.table-card-head{padding:16px 20px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.table-card-title{font-size:.875rem;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text)}
.table-card-title svg{width:16px;height:16px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;flex-shrink:0}
.count-badge{background:#EDE8FF;color:var(--brand);font-size:.6875rem;font-weight:700;padding:2px 8px;border-radius:var(--r-full)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{background:#FAFBFF}
th{padding:10px 16px;text-align:left;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);white-space:nowrap;border-bottom:1.5px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFF}

/* ── KYC specific ── */
.doc-pills{display:flex;flex-wrap:wrap;gap:4px}
.doc-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:.6875rem;font-weight:600;border:1px solid}
.doc-pill.ok{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.doc-pill.missing{background:var(--warning-bg);color:var(--warning);border-color:var(--warning-border)}
.doc-pill.rejected{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.doc-pill svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-size:.6875rem;font-weight:700}
.status-pill.pending{background:var(--warning-bg);color:var(--warning)}
.status-pill.in-review,.status-pill.not_submitted{background:var(--info-bg);color:var(--info)}
.status-pill.approved{background:var(--success-bg);color:var(--success)}
.status-pill.rejected{background:var(--danger-bg);color:var(--danger)}
.status-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

.doc-score{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700}
.score-bar{width:60px;height:6px;background:var(--border);border-radius:var(--r-full);overflow:hidden;flex-shrink:0}
.score-fill{height:100%;border-radius:var(--r-full);transition:width .4s}

.action-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.75rem;font-weight:700;padding:6px 14px;transition:all .15s;white-space:nowrap}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;flex-shrink:0}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:#2D1259}
.btn-success{background:var(--success-bg);color:var(--success);border:1.5px solid var(--success-border)}
.btn-success:hover{background:var(--success);color:#fff}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger-border)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text3);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--border);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:.6875rem;border-radius:7px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-start;justify-content:flex-end;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-panel{width:520px;max-width:100vw;height:100vh;background:var(--surface,#fff);overflow-y:auto;box-shadow:var(--shadow-md);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.4,0,.2,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.modal-head{padding:20px 24px;border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;background:var(--surface,#fff);z-index:10}
.modal-title{font-size:1rem;font-weight:800;color:var(--text);letter-spacing:-.2px}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:background .12s}
.modal-close:hover{background:var(--border);color:var(--text)}
.modal-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.modal-body{padding:24px;flex:1}

/* ── Doc viewer ── */
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.doc-item{background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .12s}
.doc-item:hover{border-color:var(--brand)}
.doc-item-label{font-size:.6875rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.doc-item-status{display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700}
.doc-item-status.ok{color:var(--success)}.doc-item-status.missing{color:var(--warning)}.doc-item-status.rejected{color:var(--danger)}
.doc-item-status svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;flex-shrink:0}

.action-panel{background:var(--surface2);border-radius:12px;padding:16px;margin-top:16px}
.action-panel-title{font-size:.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.action-panel textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.8125rem;font-family:inherit;color:var(--text);background:var(--surface,#fff);resize:vertical;min-height:80px;outline:none;transition:border-color .12s;margin-bottom:12px}
.action-panel textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(76,29,149,.07)}
.action-panel textarea::placeholder{color:var(--text4)}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap}

/* ── Empty state ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center}
.empty-ico{width:60px;height:60px;background:var(--surface2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty-ico svg{width:28px;height:28px;fill:none;stroke:var(--text4);stroke-width:1.5;stroke-linecap:round}
.empty-title{font-size:.9375rem;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:.8125rem;color:var(--text3);max-width:320px;line-height:1.6}

/* ── Loading ── */
.skeleton{background:linear-gradient(90deg,var(--border) 25%,var(--surface2) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:10px 20px;border-radius:var(--r-full);font-size:.8125rem;font-weight:600;z-index:9999;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:toastIn .25s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}

/* ── Responsive ── */
@media(max-width:768px){
  :root {
  /* New Light Premium palette */
  --bg:#FFFFFF;--bg2:#F7F6FF;--bg3:#EEECFB;
  --ink:#0D0520;--ink2:#2D1B69;--ink3:#6B7280;
  --p:#4C1D95;--p2:#6D28D9;--p3:#8B5CF6;--p4:#DDD6FE;
  --orange:#EA580C;--orange2:#F97316;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --font:'Inter',-apple-system,sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,.1);
  --pill:999px;--r:8px;--rl:16px;
  /* Legacy aliases */
  --brand:#4C1D95;--brand-dark:#6D28D9;--brand-light:#EEECFB;--brand-glow:rgba(76,29,149,.12);
  --sidebar-bg:#0f172a;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:rgba(76,29,149,.18);--sidebar-border:rgba(255,255,255,.07);
  --bg-raised:#FFFFFF;--bg-subtle:#F7F6FF;--bg-hover:#EEECFB;
  --text-primary:#0D0520;--text-secondary:#2D1B69;--text-muted:#6B7280;--text-faint:#9CA3B8;
  --border-strong:rgba(0,0,0,.12);
  --success:#12B76A;--success-bg:#ECFDF5;--success-border:rgba(18,183,106,.2);
  --warning:#F79009;--warning-bg:#FFFAEB;--warning-border:rgba(247,144,9,.2);
  --danger:#F04438;--danger-bg:#FEF3F2;--danger-border:rgba(240,68,56,.2);
  --info:#2E90FA;--info-bg:#EFF8FF;--info-border:rgba(46,144,250,.2);
  --sidebar-w:240px;--topbar-h:56px;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 8px rgba(0,0,0,.08);
  --shadow-brand:0 4px 14px rgba(76,29,149,.25);
  --t-fast:120ms cubic-bezier(.4,0,.2,1);--t-base:200ms cubic-bezier(.4,0,.2,1);
}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:252px;transform:translateX(-100%);transition:transform .22s}
  .sidebar.open{transform:translateX(0)}
  .main{grid-column:1;grid-row:2}
  .page{padding:16px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .modal-panel{width:100vw}
}
</style>
<style id="css-vars-fallback">/* Variables utilisées par la page mais jamais définies */:root{--text:#0D0520;--surface:#FFFFFF;--text3:#6B7280;--surface2:#F7F6FF;--brand-dim:rgba(76,29,149,.08);--text4:#9CA3B8;--text2:#2D1B69}</style>

<body>

      <!-- Stats -->

        <div class="stat-card amber">
          <div class="stat-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>

          <div class="stat-lbl">En attente</div>

        <div class="stat-card blue">
          <div class="stat-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>

          <div class="stat-lbl">Pas encore soumis</div>

          <div class="stat-ico"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="stat-num" id="stat-approved">–</div>
          <div class="stat-lbl">Approuvés ce mois</div>
        </div>
        <div class="stat-card red">
          <div class="stat-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
          <div class="stat-num" id="stat-rejected">–</div>
          <div class="stat-lbl">Rejetés</div>

      <!-- Toolbar -->

<script>
/* ══════════════════════════════════════════════
   Symphony KYC & Onboarding
   Docline — Back Office
══════════════════════════════════════════════ */
'use strict';

var _supa = null;
var _uid  = null;
var _allRows = [];
var _filtered = [];
var _chip = 'all';

/* ── Supabase init ── */
(function() {
  try {
    _supa = supabase.createClient(SUPA_URL, SUPA_KEY);
  } catch(e) { console.error('[KYC] Supabase init failed', e); }
})();

/* ── Auth guard ── */
window.addEventListener('DOMContentLoaded', async function() {
  if (!_supa) { showGuard('Erreur de configuration Supabase.'); return; }

  var { data: { session } } = await _supa.auth.getSession();
  if (!session) {
    window.location.href = (typeof ghpNav === 'function' ? ghpNav('/login') : '/login');
    return;
  }

  _uid = session.user.id;
  var email = (session.user.email || '').toLowerCase();

  if ((ADMIN_EMAILS || []).map(function(e){ return e.toLowerCase(); }).indexOf(email) === -1) {
    document.querySelector('.page').innerHTML = '<div class="empty-state"><div class="empty-ico"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="empty-title">Accès réservé</div><div class="empty-sub">Cette section est réservée aux super-administrateurs Docline.</div></div>';
    return;
  }

  // Render sidebar
  renderSidebar(email);
  // Render topbar avatar
  var init = email.slice(0,2).toUpperCase();
  document.getElementById('tb-avatar-btn').textContent = init;

  // Load data
  await loadKyc();
});

/* ── Sidebar render ── */
function renderSidebar(email) {
  var sb = document.getElementById('sidebar');
  if (!sb) return;
  var sections = [
    { label: 'Vue générale', items: [
      ['/symphony',           'symphony',          'Hub Symphony',           '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>'],
      ['/symphony-analytics', 'symphony-analytics','Analytics',              '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>'],
    ]},
    { label: 'Clients & CRM', items: [
      ['/symphony-kyc',       'symphony-kyc',      'KYC & Onboarding',       '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>'],
      ['/symphony-users',     'symphony-users',    'Médecins & Cliniques',   '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'],
      ['/symphony-crm',       'symphony-crm',      'CRM Médecin',            '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
      ['/symphony-featured',  'symphony-featured', 'Médecins En Vedette',    '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'],
    ]},
    { label: 'Revenus & Finance', items: [
      ['/symphony-revenue',   'symphony-revenue',  'Revenus & Finance',      '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/>'],
    ]},
    { label: 'Marketing', items: [
      ['/symphony-ads',       'symphony-ads',      'Régie Publicitaire',     '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>'],
      ['/symphony-emails',    'symphony-emails',   'Emails & Modèles',       '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>'],
    ]},
    { label: 'Équipe', items: [
      ['/symphony-agents',    'symphony-agents',   'Agents & Équipe',        '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'],
      ['/symphony-simulate',  'symphony-simulate', 'Simulation',             '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>'],
    ]},
    { label: 'Système', items: [
      ['/symphony-incidents','symphony-incidents','Incidents ITIL','<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'],
        ['/symphony-security','symphony-security', 'Sécurité & Logs',        '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'],
      ['/symphony-settings',  'symphony-settings', 'Paramètres',             '<circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/>'],
    ]},
  ];

  var initials = email.slice(0,2).toUpperCase();
  var handle   = email.split('@')[0];
  var curPath  = window.location.pathname;

  var html = '<div class="sidebar-head" style="display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--sidebar-border);padding:16px">'
    + '<img src="docline-logo-white.svg" alt="Docline" style="height:22px;width:auto;display:block;max-width:120px;flex-shrink:0">'
    + '<span style="background:rgba(247,144,9,.18);color:#F59E0B;border:1px solid rgba(247,144,9,.28);font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;letter-spacing:.4px;white-space:nowrap">ADMIN</span>'
    + '</div>';

  sections.forEach(function(sec) {
    html += '<div class="sidebar-section">' + sec.label + '</div>';
    sec.items.forEach(function(item) {
      var href = item[0], key = item[1], label = item[2], icon = item[3];
      var isActive = curPath === href || curPath.startsWith(href + '/') || key === 'symphony-kyc';
      html += '<a href="' + (typeof ghpNav === 'function' ? ghpNav(href) : href) + '" class="nav-item' + (isActive ? ' active' : '') + '">'
        + '<svg viewBox="0 0 24 24">' + icon + '</svg>' + label + '</a>';
    });
  });

  html += '<div class="sidebar-footer"><div style="position:relative" id="sb-pop-wrap">'
    + '<div class="sidebar-user" id="sb-user-btn" onclick="toggleUserMenu()">'
    + '<div class="user-avatar">' + initials + '</div>'
    + '<div><div class="user-name">' + handle + '</div><div class="user-role">Symphony Admin</div></div>'
    + '</div>'
    + '<div id="sb-user-menu" style="display:none;position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:#1C1F28;border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);padding:6px;box-shadow:0 -12px 32px rgba(0,0,0,.5);z-index:300">'
    + '<a href="/dashboard" class="nav-item" style="color:rgba(255,255,255,.6)"><svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><line x1="21" y1="3" x2="14" y2="10"/><polyline points="9 21 3 21 3 15"/><line x1="3" y1="21" x2="10" y2="14"/></svg>App médecin</a>'
    + '<div style="height:1px;background:rgba(255,255,255,.07);margin:4px 8px"></div>'
    + '<button onclick="signOut()" class="nav-item" style="color:rgba(240,68,56,.8);width:100%;text-align:left;border:none;cursor:pointer;background:transparent;font-family:inherit"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Déconnexion</button>'
    + '</div></div></div>';

  sb.innerHTML = html;
}

function toggleUserMenu() {
  var menu = document.getElementById('sb-user-menu');
  if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

async function signOut() {
  if (_supa) await _supa.auth.signOut();
  window.location.href = (typeof ghpNav === 'function' ? ghpNav('/login') : '/login');
}

/* ── Load KYC data (source : profiles.kyc_*) ── */
// Statuts en base : not_submitted · pending_review · approved · rejected
var KYC_FROM_DB = { not_submitted:'not_submitted', pending_review:'pending', approved:'approved', rejected:'rejected' };
async function loadKyc() {
  if (!_supa) return;
  try {
    var [profRes, subRes] = await Promise.all([
      _supa.from('profiles')
        .select('id,email,full_name,first_name,last_name,specialty,wilaya,city,plan,created_at,kyc_status,kyc_document_url,kyc_document_type,kyc_order_number,kyc_submitted_at,kyc_reject_reason')
        .order('kyc_submitted_at', { ascending: false, nullsFirst: false })
        .limit(1000),
      _supa.from('subscriptions').select('user_id,plan,status')
    ]);
    if (profRes.error) throw profRes.error;
    var planOf = {};
    (subRes.data || []).forEach(function(s) { if (s.status === 'active' || s.status === 'trialing') planOf[s.user_id] = s.plan; });

    _allRows = (profRes.data || []).map(function(p) {
      var name = p.full_name || ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || p.email || '—';
      var docs = { document: p.kyc_document_url ? 'ok' : 'missing', ordre: p.kyc_order_number ? 'ok' : 'missing' };
      var ok = (docs.document === 'ok' ? 1 : 0) + (docs.ordre === 'ok' ? 1 : 0);
      return {
        user_id: p.id, email: p.email, full_name: name, specialty: p.specialty || '',
        city: p.city || p.wilaya || '', rpps: p.kyc_order_number || '',
        plan: planOf[p.id] || p.plan || 'free',
        kyc_status: KYC_FROM_DB[p.kyc_status] || 'not_submitted',
        kyc_note: p.kyc_reject_reason || '',
        doc_url: p.kyc_document_url || '', doc_type: p.kyc_document_type || '',
        docs: docs, score: Math.round(ok * 50),
        created_at: p.kyc_submitted_at || p.created_at
      };
    });
    refreshKycStats();
    var now = new Date();
    document.getElementById('last-refresh').textContent = 'Mis à jour à ' + now.getHours() + 'h' + String(now.getMinutes()).padStart(2,'0');
    applyFilters();
  } catch(e) {
    console.error('[KYC] Load error:', e);
    document.getElementById('kyc-tbody').innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-title">Erreur de chargement</div><div class="empty-sub">' + esc(e.message || 'Erreur inconnue') + '</div></div></td></tr>';
  }
}

function refreshKycStats() {
  function n(st) { return _allRows.filter(function(r) { return r.kyc_status === st; }).length; }
  document.getElementById('stat-pending').textContent  = n('pending');
  document.getElementById('stat-review').textContent   = n('not_submitted');
  document.getElementById('stat-approved').textContent = n('approved');
  document.getElementById('stat-rejected').textContent = n('rejected');
  document.getElementById('stat-total').textContent    = _allRows.length;
  var badge = document.getElementById('tb-pending-badge');
  if (badge) {
    var p = n('pending');
    badge.textContent = p + ' en attente';
    badge.style.display = p > 0 ? 'inline-flex' : 'none';
  }
}

/* ── Filters ── */
function setChip(val) {
  _chip = val;
  ['all','pending','review','approved','rejected'].forEach(function(k) {
    var el = document.getElementById('chip-' + k);
    if (el) el.classList.toggle('active', k === val || ('not_submitted' === val && k === 'review'));
  });
  applyFilters();
}

function applyFilters() {
  var q       = (document.getElementById('search-input').value || '').toLowerCase().trim();
  var statusF = document.getElementById('status-filter').value;
  var planF   = document.getElementById('plan-filter').value;

  _filtered = _allRows.filter(function(r) {
    if (_chip !== 'all' && r.kyc_status !== _chip) return false;
    if (statusF && r.kyc_status !== statusF) return false;
    if (planF && r.plan !== planF) return false;
    if (q && !(r.full_name.toLowerCase().includes(q) || (r.rpps||'').includes(q) || (r.specialty||'').toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('count-badge').textContent = _filtered.length;
  renderTable();
}

document.addEventListener('DOMContentLoaded', function() {
  var si = document.getElementById('search-input');
  if (si) si.addEventListener('input', applyFilters);
});

/* ── Render table ── */
var DOC_LABELS = { document:'Pièce justificative', ordre:'N° d’ordre', cni:'CNI', diplome:'Diplôme', justif:'Justificatif', rpps:'RPPS', assurance:'Assurance' };

function renderTable() {
  var tbody = document.getElementById('kyc-tbody');
  if (!tbody) return;

  if (_filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="empty-title">Aucun dossier</div><div class="empty-sub">Aucun dossier KYC ne correspond aux filtres.</div></div></td></tr>';
    return;
  }

  tbody.innerHTML = _filtered.map(function(r) {
    var statusClass = { pending:'pending', 'not_submitted':'not_submitted', approved:'approved', rejected:'rejected' }[r.kyc_status] || 'pending';
    var statusLabel = { pending:'En attente', 'not_submitted':'Non soumis', approved:'Approuvé', rejected:'Rejeté' }[r.kyc_status] || r.kyc_status;
    var planBadge = { free:'background:#F3F4F6;color:#6B7280', pro:'background:#EDE9FE;color:#6D28D9', clinic:'background:#D1FAE5;color:#065F46' }[r.plan] || '';
    var scoreColor = r.score >= 80 ? 'var(--success)' : r.score >= 50 ? 'var(--warning)' : 'var(--danger)';

    var docPills = Object.entries(r.docs || {}).slice(0,3).map(function(entry) {
      var k = entry[0], v = entry[1];
      var cls = v === 'ok' ? 'ok' : v === 'rejected' ? 'rejected' : 'missing';
      var icon = v === 'ok' ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
               : v === 'rejected' ? '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
               : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>';
      return '<span class="doc-pill ' + cls + '">' + icon + (DOC_LABELS[k]||k) + '</span>';
    }).join('');
    var extraDocs = Object.keys(r.docs||{}).length > 3 ? '<span style="font-size:.625rem;color:var(--text4);font-weight:600">+' + (Object.keys(r.docs).length - 3) + '</span>' : '';

    var dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) : '—';

    return '<tr>'
      + '<td><div class="td-inner" style="flex-direction:column;align-items:flex-start;gap:2px"><div style="font-size:.8125rem;font-weight:700;color:var(--text)">' + esc(r.full_name) + '</div><div style="font-size:.6875rem;color:var(--text3)">' + esc(r.specialty) + (r.city ? ' · ' + esc(r.city) : '') + '</div>' + (r.rpps ? '<div style="font-size:.625rem;color:var(--text4);font-family:monospace">RPPS: ' + esc(r.rpps) + '</div>' : '') + '</div></td>'
      + '<td><span class="status-pill ' + statusClass + '">' + statusLabel + '</span></td>'
      + '<td><span class="badge" style="' + planBadge + ';font-size:.6875rem;font-weight:700;padding:3px 8px;border-radius:var(--r-full)">' + (r.plan||'free').toUpperCase() + '</span></td>'
      + '<td><div class="doc-pills">' + docPills + extraDocs + '</div></td>'
      + '<td><div class="doc-score"><div class="score-bar"><div class="score-fill" style="width:' + r.score + '%;background:' + scoreColor + '"></div></div><span style="font-size:.75rem;font-weight:700;color:' + scoreColor + '">' + r.score + '%</span></div></td>'
      + '<td style="font-size:.75rem;color:var(--text3);white-space:nowrap">' + dateStr + '</td>'
      + '<td><div class="action-row"><button class="btn btn-ghost btn-sm" onclick="openDetail(\'' + r.user_id + '\')"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Voir</button>'
      + (r.kyc_status === 'pending' ? '<button class="btn btn-success btn-sm" onclick="setKycStatus(\'' + r.user_id + '\',\'approved\')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Approuver</button>' : '')
      + (r.kyc_status !== 'rejected' ? '<button class="btn btn-danger btn-sm" onclick="setKycStatus(\'' + r.user_id + '\',\'rejected\')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Rejeter</button>' : '')
      + '</div></td>'
      + '</tr>';
  }).join('');
}

/* ── Detail panel ── */
function openDetail(userId) {
  var r = _allRows.find(function(x) { return x.user_id === userId; });
  if (!r) return;

  document.getElementById('modal-doctor-name').textContent = r.full_name;

  var docGrid = Object.entries(r.docs || {}).map(function(entry) {
    var k = entry[0], v = entry[1];
    var cls = v === 'ok' ? 'ok' : v === 'rejected' ? 'rejected' : 'missing';
    var icon = v === 'ok' ? '<polyline points="20 6 9 17 4 12"/>' : v === 'rejected' ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>';
    var label = { ok:'Fourni & valide', rejected:'Rejeté', missing:'Manquant' }[v] || v;
    return '<div class="doc-item" title="' + (DOC_LABELS[k]||k) + '">'
      + '<div class="doc-item-label">' + (DOC_LABELS[k]||k) + '</div>'
      + '<div class="doc-item-status ' + cls + '"><svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round">' + icon + '</svg>' + label + '</div>'
      + '</div>';
  }).join('');

  var planBadge = { free:'background:#F3F4F6;color:#6B7280', pro:'background:#EDE9FE;color:#6D28D9', clinic:'background:#D1FAE5;color:#065F46' }[r.plan] || '';
  var statusClass = { pending:'pending', 'not_submitted':'not_submitted', approved:'approved', rejected:'rejected' }[r.kyc_status] || 'pending';
  var statusLabel = { pending:'En attente', 'not_submitted':'Non soumis', approved:'Approuvé', rejected:'Rejeté' }[r.kyc_status] || r.kyc_status;

  document.getElementById('modal-body').innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">'
    + '<div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#4C1D95,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0">' + (r.full_name||'?')[0].toUpperCase() + '</div>'
    + '<div><div style="font-size:1rem;font-weight:800;color:var(--text)">' + esc(r.full_name) + '</div>'
    + '<div style="font-size:.8125rem;color:var(--text3);margin-top:2px">' + esc(r.specialty) + (r.city ? ' · ' + esc(r.city) : '') + '</div>'
    + '<div style="display:flex;gap:6px;margin-top:6px"><span class="status-pill ' + statusClass + '">' + statusLabel + '</span>'
    + '<span style="' + planBadge + ';font-size:.6875rem;font-weight:700;padding:3px 8px;border-radius:var(--r-full)">' + (r.plan||'free').toUpperCase() + '</span></div>'
    + '</div></div>'
    + (r.rpps ? '<div style="background:var(--surface2);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:.75rem;color:var(--text3)">RPPS: <strong style="color:var(--text);font-family:monospace">' + esc(r.rpps) + '</strong></div>' : '')
    + '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text4);margin-bottom:10px">Documents</div>'
    + '<div class="doc-grid">' + (docGrid || '<div style="color:var(--text3);font-size:.8125rem;grid-column:1/-1">Aucun document fourni</div>') + '</div>'
    + (r.doc_url ? '<button class="btn btn-ghost" style="margin:12px 0 4px" onclick="openKycDoc(\'' + r.user_id + '\')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Ouvrir le document</button>' : '')
    + '<div class="action-panel">'
    + '<div class="action-panel-title">Note KYC</div>'
    + '<textarea id="kyc-note-input" placeholder="Note interne sur le dossier…">' + esc(r.kyc_note || '') + '</textarea>'
    + '<div class="action-buttons">'
    + '<button class="btn btn-success" onclick="setKycStatus(\'' + r.user_id + '\',\'approved\',true)"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Approuver</button>'
    + '<button class="btn btn-danger" onclick="setKycStatus(\'' + r.user_id + '\',\'rejected\',true)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Rejeter</button>'
    + '</div></div>';

  document.getElementById('detail-modal').style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detail-modal').style.display = 'none';
}

function closeModal(e) {
  if (e.target === document.getElementById('detail-modal')) closeDetail();
}

/* ── KYC status update (profiles + kyc_audit_log) ── */
var KYC_TO_DB = { approved:'approved', rejected:'rejected', pending:'pending_review', not_submitted:'not_submitted' };
async function setKycStatus(userId, status, fromModal) {
  if (!_supa) return;
  var note = fromModal ? ((document.getElementById('kyc-note-input') || {}).value || '').trim() : '';
  if (status === 'rejected' && !note && fromModal) { showToast('Indiquez le motif du refus dans la note.', true); return; }
  try {
    var sess = (await _supa.auth.getSession()).data.session;
    var upd = { kyc_status: KYC_TO_DB[status], kyc_reviewed_at: new Date().toISOString(), kyc_reviewer_id: sess ? sess.user.id : null };
    if (status === 'rejected') upd.kyc_reject_reason = note || 'Dossier incomplet';
    if (status === 'approved') upd.kyc_reject_reason = null;
    var { error } = await _supa.from('profiles').update(upd).eq('id', userId);
    if (error) throw error;
    await _supa.from('kyc_audit_log').insert({ doctor_id: userId, action: status, reviewer_id: upd.kyc_reviewer_id, note: note || null }).then(null, function() {});

    var row = _allRows.find(function(r) { return r.user_id === userId; });
    if (row) { row.kyc_status = status; row.kyc_note = upd.kyc_reject_reason || ''; }
    showToast({ approved:'Dossier approuvé', rejected:'Dossier refusé' }[status] || 'Statut mis à jour');
    if (fromModal) closeDetail();
    refreshKycStats();
    applyFilters();
  } catch(e) {
    var msg = (e && e.message) || 'Erreur inconnue';
    if (/row-level security|permission denied/i.test(msg)) msg = 'Votre poste ne permet pas de décider un dossier KYC.';
    showToast('Erreur : ' + msg, true);
  }
}

/* Ouvre le document KYC via une URL signée d'une heure (stockage privé doctor-kyc) */
async function openKycDoc(userId) {
  var r = _allRows.find(function(x) { return x.user_id === userId; });
  if (!r || !r.doc_url) return;
  var w = window.open('', '_blank');
  try {
    var path = r.doc_url.indexOf('doctor-kyc/') !== -1 ? r.doc_url.substring(r.doc_url.indexOf('doctor-kyc/') + 11).split('?')[0] : r.doc_url;
    var res = await _supa.storage.from('doctor-kyc').createSignedUrl(path, 3600);
    if (res.error) throw res.error;
    w.location = res.data.signedUrl;
  } catch(e) { if (w) w.close(); showToast('Document introuvable : ' + (e.message || ''), true); }
}

/* ── Helpers ── */
function esc(s) {
  var d = document.createElement('div');
  d.textContent = String(s || '');
  return d.innerHTML;
}

function showGuard(msg) {
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#6B7280;text-align:center;padding:24px"><div><div style="font-size:32px;margin-bottom:12px">🔒</div><div style="font-size:16px;font-weight:700;color:#374151;margin-bottom:6px">Accès refusé</div><div>' + msg + '</div></div></div>';
}

function showToast(msg, isErr) {
  var t = document.createElement('div');
  t.className = 'toast';
  if (isErr) t.style.background = '#DC2626';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, 3000);
}
</script>
