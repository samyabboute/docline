<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Équipe · Docline Symphony</title>
<script src="config.js?v=3"></script>
<script src="shell.js?v=13"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4C1D95">
<style>
:root{--ag-line:rgba(13,5,32,.07);--ag-soft:#F4F2FF}
.ag-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ag-eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.ag-title{font-size:26px;font-weight:900;letter-spacing:-.7px;line-height:1.1}
.ag-sub{font-size:13.5px;color:var(--text-3);margin-top:6px;max-width:60ch}
.ag-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.ag-sum div{background:var(--surface);border:1px solid var(--ag-line);border-radius:14px;padding:14px 16px}
.ag-sum b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ag-sum span{font-size:12px;color:var(--text-3);font-weight:600}
.ag-tabs{display:flex;gap:6px;margin-bottom:14px}
.ag-tab{padding:8px 16px;border-radius:999px;border:1px solid var(--ag-line);background:var(--surface);font:600 13px Inter,sans-serif;color:var(--text-3);cursor:pointer}
.ag-tab.on{background:#0D0520;border-color:#0D0520;color:#fff}
.ag-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ag-tools input,.ag-tools select{padding:10px 13px;border-radius:12px;border:1px solid var(--ag-line);background:var(--surface);font:500 13.5px Inter,sans-serif;color:var(--text);outline:none}
.ag-tools input{flex:1;min-width:200px}
.ag-tools input:focus,.ag-tools select:focus{border-color:var(--brand)}
.ag-list{background:var(--surface);border:1px solid var(--ag-line);border-radius:16px;overflow:hidden}
.ag-row{display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 120px auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--ag-line)}
.ag-row:last-child{border-bottom:none}
.ag-row.off{opacity:.55}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;position:relative}
.av .dot{position:absolute;right:-2px;bottom:-2px;border:2px solid var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.available{background:#10B981}.dot.busy{background:#F59E0B}.dot.away{background:#94A3B8}.dot.offline{background:#CBD5E1}
.ag-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-meta{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 8px;border-radius:999px;background:var(--ag-soft);font-size:11.5px;font-weight:600;color:var(--text-2)}
.chip.lead{background:#0D0520;color:#fff}
.load{font-size:12px;color:var(--text-3);font-weight:600}
.load i{display:block;height:5px;border-radius:5px;background:var(--ag-soft);margin-top:5px;overflow:hidden}
.load i span{display:block;height:100%;background:var(--brand);border-radius:5px}
.load.full i span{background:#DC2626}
.ag-btn{padding:8px 13px;border-radius:10px;border:1px solid var(--ag-line);background:var(--surface);font:650 12.5px Inter,sans-serif;color:var(--text);cursor:pointer;white-space:nowrap}
.ag-btn:hover{border-color:var(--brand);color:var(--brand)}
.ag-btn.primary{background:#0D0520;border-color:#0D0520;color:#fff}
.ag-btn.primary:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--ag-line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.team h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.team p{font-size:12.5px;color:var(--text-3);line-height:1.5}
.team .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.empty{padding:48px 24px;text-align:center;color:var(--text-3);font-size:14px}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

.md-wrap{position:fixed;inset:0;z-index:950;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;background:rgba(13,5,32,.4);backdrop-filter:blur(4px);overflow-y:auto}
.md-wrap.on{display:flex}
.md{width:min(560px,100%);background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(13,5,32,.25);overflow:hidden}
.md-h{padding:22px 24px 4px}
.md-t{font-size:19px;font-weight:800;letter-spacing:-.4px}
.md-s{font-size:13px;color:var(--text-3);margin-top:3px}
.md-b{padding:16px 24px 20px;display:flex;flex-direction:column;gap:14px}
.md-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--ag-line);background:#FCFBFF}
.fld label,.fld .lbl{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ag-line);font:500 14px Inter,sans-serif;color:var(--text);background:var(--surface);outline:none}
.fld input[type=checkbox]{width:auto}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ag-line);font-size:13.5px}
.sk:last-child{border-bottom:none}
.sk select{padding:7px 10px;border-radius:10px;border:1px solid var(--ag-line);font:500 13px Inter,sans-serif;background:var(--surface);color:var(--text)}
.mem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ag-line);font-size:13.5px}
.mem:last-child{border-bottom:none}
.mem label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin:0}
.note{font-size:12.5px;color:var(--text-3);line-height:1.5}
.ag-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0D0520;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.ag-toast.on{opacity:1;transform:translateX(-50%)}.ag-toast.err{background:#B91C1C}
@media (max-width:820px){
  .ag-sum{grid-template-columns:1fr 1fr}
  .ag-row{grid-template-columns:40px minmax(0,1fr) auto}
  .ag-row .c-teams,.ag-row .c-load{display:none}
  .fld-row{grid-template-columns:1fr}
  .md-wrap{padding:0;align-items:stretch}.md{border-radius:0;min-height:100%}
}
</style>
<script src="loader.js?v=2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="shell-sidebar" id="shell-sidebar"></aside>
  <div class="shell-overlay sb-overlay" id="shell-overlay"></div>
  <header class="shell-topbar" id="shell-topbar"></header>
  <main class="shell-main">
    <div class="shell-page">
      <div class="page-wrap">
        <div class="ag-head">
          <div>
            <div class="ag-eyebrow">Symphony · Équipe</div>
            <h1 class="ag-title">Agents et équipes</h1>
            <p class="ag-sub">Qui travaille dans quelle équipe, avec quelles compétences, et combien de tickets chacun porte en ce moment. Les comptes et les accès se gèrent depuis le QG.</p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <a class="ag-btn" href="/symphony-hq#team">Comptes et accès</a>
            <button class="ag-btn primary" type="button" id="btn-team" hidden>Nouvelle équipe</button>
          </div>
        </div>
        <div class="ag-sum" id="sum"></div>
        <div class="ag-tabs" role="tablist">
          <button class="ag-tab on" type="button" data-tab="people" role="tab">Agents</button>
          <button class="ag-tab" type="button" data-tab="teams" role="tab">Équipes</button>
        </div>
        <div id="pane-people">
          <div class="ag-tools">
            <input id="q" type="search" placeholder="Rechercher un nom, un email, un numéro d'employé" autocomplete="off">
            <select id="f-dept"><option value="">Tous les départements</option></select>
            <select id="f-avail"><option value="">Toutes les disponibilités</option><option value="available">Disponibles</option><option value="busy">Occupés</option><option value="away">Absents</option><option value="offline">Hors ligne</option></select>
          </div>
          <div class="ag-list" id="people"><div class="empty">Chargement</div></div>
        </div>
        <div id="pane-teams" hidden><div class="team-grid" id="teams"></div></div>
      </div>
    </div>
  </main>
</div>

<div class="md-wrap" id="md"><div class="md" role="dialog" aria-modal="true" aria-labelledby="md-t">
  <div class="md-h"><div class="md-t" id="md-t"></div><div class="md-s" id="md-s"></div></div>
  <div class="md-b" id="md-b"></div>
  <div class="md-f"><button class="ag-btn" type="button" id="md-x">Fermer</button><button class="ag-btn primary" type="button" id="md-ok">Enregistrer</button></div>
</div></div>
<div class="ag-toast" id="toast" role="status" aria-live="polite"></div>

<script>
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
var D = null, tab = 'people';
var AVAIL = { available:'Disponible', busy:'Occupé', away:'Absent', offline:'Hors ligne' };
var ROLE = { super_admin:'Direction générale', l3:'Responsable', l2:'Confirmé', l1:'Agent', support:'Support', kyc_agent:'Agent KYC' };
var LEVEL = { 1:'Débutant', 2:'Confirmé', 3:'Référent' };
var ERR = { FORBIDDEN:'Votre poste ne permet pas cette action.', HAS_OPEN_TICKETS:'Cet agent a encore des tickets ouverts dans cette équipe. Réaffectez-les d’abord.',
  SUPERVISOR_INVALID:'Un agent ne peut pas être son propre responsable.', LEAD_INVALID:'Ce responsable n’est pas un membre actif.' };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m, err){ var t = document.getElementById('toast'); t.textContent = m; t.className = 'ag-toast on' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(function(){ t.className = 'ag-toast'; }, 3200); }
function errMsg(e){ var m = (e && e.message) || ''; for (var k in ERR) if (m.indexOf(k) !== -1) return ERR[k]; if (/duplicate key/.test(m)) return 'Ce nom existe déjà dans ce département.'; return m || 'Erreur inattendue.'; }
async function rpc(fn, a){ var r = await sb.rpc(fn, a || {}); if (r.error) throw r.error; return r.data; }
function initials(n){ return String(n || '?').split(/[\s@.]+/).filter(Boolean).slice(0,2).map(function(x){ return x[0].toUpperCase(); }).join(''); }
function hue(s){ var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return 'hsl(' + (250 + h % 60) + ' 45% 42%)'; }
function dept(k){ var d = (D.departments || []).filter(function(x){ return x.key === k; })[0]; return d ? d.name : k; }
function staff(id){ return (D.staff || []).filter(function(s){ return s.id === id; })[0]; }
function teamsOf(id){ return (D.teams || []).filter(function(t){ return t.members.some(function(m){ return m.staff_id === id; }); }); }
function skillName(k){ var s = (D.skills || []).filter(function(x){ return x.key === k; })[0]; return s ? s.name : k; }

function render(){
  var act = D.staff.filter(function(s){ return s.is_active; });
  var load = act.reduce(function(a, s){ return a + s.load; }, 0);
  var queued = D.teams.reduce(function(a, t){ return a + t.queued; }, 0);
  document.getElementById('sum').innerHTML =
    '<div><b>' + act.length + '</b><span>Agents actifs</span></div>' +
    '<div><b>' + act.filter(function(s){ return s.availability === 'available'; }).length + '</b><span>Disponibles maintenant</span></div>' +
    '<div><b>' + load + '</b><span>Tickets en cours</span></div>' +
    '<div><b>' + queued + '</b><span>Tickets en file</span></div>';
  var q = document.getElementById('q').value.trim().toLowerCase(), fd = document.getElementById('f-dept').value, fa = document.getElementById('f-avail').value;
  var rows = D.staff.filter(function(s){
    if (fd && s.department !== fd) return false;
    if (fa && s.availability !== fa) return false;
    return !q || [s.full_name, s.email, s.employee_id, s.title].join(' ').toLowerCase().indexOf(q) !== -1;
  });
  document.getElementById('people').innerHTML = rows.length ? rows.map(function(s){
    var ts = teamsOf(s.id), pct = Math.min(100, Math.round(100 * s.load / Math.max(1, s.max_active_tickets)));
    return '<div class="ag-row' + (s.is_active ? '' : ' off') + '">' +
      '<div class="av" style="background:' + hue(s.email) + '">' + esc(initials(s.full_name || s.email)) + '<span class="dot ' + s.availability + '" title="' + esc(AVAIL[s.availability]) + '"></span></div>' +
      '<div style="min-width:0"><div class="ag-name">' + esc(s.full_name || s.email) + (s.is_active ? '' : ' · inactif') + '</div>' +
        '<div class="ag-meta">' + esc([s.title || ROLE[s.role] || s.role, dept(s.department), s.employee_id].filter(Boolean).join(' · ')) + '</div>' +
        (s.skills.length ? '<div class="chips" style="margin-top:6px">' + s.skills.map(function(k){ return '<span class="chip" title="' + esc(LEVEL[k.level]) + '">' + esc(skillName(k.key)) + '</span>'; }).join('') + '</div>' : '') + '</div>' +
      '<div class="c-teams chips">' + (ts.length ? ts.map(function(t){ var lead = t.members.some(function(m){ return m.staff_id === s.id && m.is_lead; }); return '<span class="chip' + (lead ? ' lead' : '') + '">' + esc(t.name) + '</span>'; }).join('') : '<span class="ag-meta">Aucune équipe</span>') + '</div>' +
      '<div class="c-load load' + (s.load >= s.max_active_tickets ? ' full' : '') + '">' + s.load + ' / ' + s.max_active_tickets + ' tickets<i><span style="width:' + pct + '%"></span></i></div>' +
      '<div>' + (D.can_manage ? '<button class="ag-btn" type="button" data-edit="' + s.id + '">Gérer</button>' : '') + '</div></div>';
  }).join('') : '<div class="empty"><strong>Aucun agent</strong>Aucun membre ne correspond à ces filtres.</div>';

  document.getElementById('teams').innerHTML = D.teams.map(function(t){
    var lead = t.lead_staff_id && staff(t.lead_staff_id);
    return '<div class="team"><div><div class="ag-meta">' + esc(dept(t.department_key)) + '</div><h3>' + esc(t.name) + '</h3></div>' +
      (t.description ? '<p>' + esc(t.description) + '</p>' : '') +
      '<div class="chips">' + (t.members.length ? t.members.map(function(m){ var s = staff(m.staff_id); return s ? '<span class="chip' + (m.is_lead ? ' lead' : '') + '">' + esc(s.full_name || s.email) + '</span>' : ''; }).join('') : '<span class="ag-meta">Aucun membre : les tickets de cette file attendront.</span>') + '</div>' +
      '<div class="foot"><span class="ag-meta">' + t.queued + ' en file' + (lead ? ' · responsable ' + esc(lead.full_name) : '') + '</span>' +
      (D.can_manage ? '<button class="ag-btn" type="button" data-team="' + t.id + '">Gérer</button>' : '') + '</div></div>';
  }).join('');
}

/* ── Fenêtre ── */
var onSave = null;
function modal(title, sub, body, save){
  document.getElementById('md-t').textContent = title; document.getElementById('md-s').textContent = sub || '';
  document.getElementById('md-b').innerHTML = body; onSave = save;
  document.getElementById('md-ok').hidden = !save;
  document.getElementById('md').classList.add('on');
}
function closeModal(){ document.getElementById('md').classList.remove('on'); onSave = null; }

function editStaff(id){
  var s = staff(id), mine = {}; s.skills.forEach(function(k){ mine[k.key] = k.level; });
  var opts = function(cur){ return '<option value="">Non</option>' + [1,2,3].map(function(l){ return '<option value="' + l + '"' + (cur == l ? ' selected' : '') + '>' + LEVEL[l] + '</option>'; }).join(''); };
  modal(s.full_name || s.email, (ROLE[s.role] || s.role) + ' · ' + s.email,
    '<div class="fld-row"><div class="fld"><label for="e-dept">Département</label><select id="e-dept">' + D.departments.map(function(d){ return '<option value="' + d.key + '"' + (d.key === s.department ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><label for="e-max">Tickets en cours au maximum</label><input id="e-max" type="number" min="1" max="50" value="' + s.max_active_tickets + '"></div></div>' +
    '<div class="fld-row"><div class="fld"><label for="e-sup">Responsable direct</label><select id="e-sup"><option value="">Aucun</option>' + D.staff.filter(function(x){ return x.id !== s.id && x.is_active; }).map(function(x){ return '<option value="' + x.id + '"' + (x.id === s.supervisor_id ? ' selected' : '') + '>' + esc(x.full_name || x.email) + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><label for="e-av">Disponibilité</label><select id="e-av">' + Object.keys(AVAIL).map(function(k){ return '<option value="' + k + '"' + (k === s.availability ? ' selected' : '') + '>' + AVAIL[k] + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="fld"><span class="lbl">Compétences</span><p class="note" style="margin-bottom:6px">Une compétence permet de recevoir les tickets d’un service. Elle ne donne aucun droit supplémentaire.</p>' +
      D.skills.map(function(k){ return '<div class="sk"><span>' + esc(k.name) + '</span><select data-skill="' + k.key + '" data-was="' + (mine[k.key] || '') + '" aria-label="Niveau ' + esc(k.name) + '">' + opts(mine[k.key]) + '</select></div>'; }).join('') + '</div>' +
    '<div class="fld"><span class="lbl">Équipes</span>' + D.teams.map(function(t){ var m = t.members.filter(function(x){ return x.staff_id === s.id; })[0];
      return '<div class="mem"><label style="color:var(--text);font-size:13.5px"><input type="checkbox" data-team-in="' + t.id + '" data-was="' + (m ? 1 : 0) + '"' + (m ? ' checked' : '') + '> ' + esc(t.name) + '</label>' +
        '<label><input type="checkbox" data-team-lead="' + t.id + '" data-was="' + (m && m.is_lead ? 1 : 0) + '"' + (m && m.is_lead ? ' checked' : '') + '> responsable</label></div>'; }).join('') + '</div>',
    async function(){
      var b = document.getElementById('md-b');
      await rpc('org_set_staff_ops', { p_staff:s.id, p_department:b.querySelector('#e-dept').value, p_max_active:parseInt(b.querySelector('#e-max').value, 10) || 8, p_supervisor:b.querySelector('#e-sup').value || null });
      var av = b.querySelector('#e-av').value;
      if (av !== s.availability) await rpc('org_set_availability', { p_status:av, p_staff:s.id });
      var sk = b.querySelectorAll('[data-skill]');
      for (var i = 0; i < sk.length; i++) if (sk[i].value !== sk[i].dataset.was)
        await rpc('org_set_skill', { p_staff:s.id, p_skill:sk[i].dataset.skill, p_level:sk[i].value ? parseInt(sk[i].value, 10) : null, p_expires_at:null });
      var tm = b.querySelectorAll('[data-team-in]');
      for (var j = 0; j < tm.length; j++) {
        var cb = tm[j], lead = b.querySelector('[data-team-lead="' + cb.dataset.teamIn + '"]');
        var inNow = cb.checked || lead.checked, was = cb.dataset.was === '1';
        if (inNow !== was || (inNow && String(+lead.checked) !== lead.dataset.was))
          await rpc('org_team_member', { p_team:cb.dataset.teamIn, p_staff:s.id, p_member:inNow, p_is_lead:lead.checked });
      }
    });
}
function editTeam(id){
  var t = id ? D.teams.filter(function(x){ return x.id === id; })[0] : { department_key:D.departments[0].key, name:'', description:'', lead_staff_id:null };
  modal(id ? t.name : 'Nouvelle équipe', 'Une équipe est une file d’attente : les tickets de ses services y arrivent.',
    '<div class="fld"><label for="t-name">Nom</label><input id="t-name" maxlength="80" value="' + esc(t.name) + '"></div>' +
    '<div class="fld-row"><div class="fld"><label for="t-dept">Département</label><select id="t-dept">' + D.departments.map(function(d){ return '<option value="' + d.key + '"' + (d.key === t.department_key ? ' selected' : '') + '>' + esc(d.name) + '</option>'; }).join('') + '</select></div>' +
    '<div class="fld"><label for="t-lead">Responsable</label><select id="t-lead"><option value="">Aucun</option>' + D.staff.filter(function(x){ return x.is_active; }).map(function(x){ return '<option value="' + x.id + '"' + (x.id === t.lead_staff_id ? ' selected' : '') + '>' + esc(x.full_name || x.email) + '</option>'; }).join('') + '</select></div></div>' +
    '<div class="fld"><label for="t-desc">Description</label><textarea id="t-desc" rows="3" maxlength="400">' + esc(t.description || '') + '</textarea></div>',
    async function(){
      var n = document.getElementById('t-name').value.trim();
      if (n.length < 2) throw new Error('Donnez un nom d’au moins 2 caractères.');
      await rpc('org_save_team', { p_id:id || null, p_department:document.getElementById('t-dept').value, p_name:n,
        p_description:document.getElementById('t-desc').value, p_lead:document.getElementById('t-lead').value || null });
    });
}

async function load(){
  try { D = await rpc('org_directory'); }
  catch (e) { document.getElementById('people').innerHTML = '<div class="empty"><strong>Accès impossible</strong>' + esc(errMsg(e)) + '</div>'; return; }
  var fd = document.getElementById('f-dept');
  if (fd.options.length === 1) D.departments.forEach(function(d){ fd.add(new Option(d.name, d.key)); });
  document.getElementById('btn-team').hidden = !D.can_manage;
  render();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-edit],[data-team],#btn-team,#md-x');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; document.querySelectorAll('.ag-tab').forEach(function(b){ b.classList.toggle('on', b === t); });
    document.getElementById('pane-people').hidden = tab !== 'people'; document.getElementById('pane-teams').hidden = tab !== 'teams'; return; }
  if (t.dataset.edit) return editStaff(t.dataset.edit);
  if (t.dataset.team) return editTeam(t.dataset.team);
  if (t.id === 'btn-team') return editTeam(null);
  if (t.id === 'md-x') closeModal();
});
document.getElementById('md-ok').onclick = async function(){
  if (!onSave) return; var b = this; b.disabled = true;
  try { await onSave(); closeModal(); toast('Enregistré'); await load(); } catch (e) { toast(errMsg(e), true); }
  b.disabled = false;
};
document.getElementById('md').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });
['q','f-dept','f-avail'].forEach(function(id){ document.getElementById(id).addEventListener('input', function(){ if (D) render(); }); });

(async function(){
  var s = await sb.auth.getSession();
  if (!s.data.session) { location.href = '/login'; return; }
  var u = s.data.session.user;
  Shell.init({ page:'symphony-agents', title:'Équipe', isPro:true, plan:'admin', isSymphony:true,
    userName:Shell.displayName(u.user_metadata || {}, u.email), userEmail:u.email });
  load();
})();
</script>
